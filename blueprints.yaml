name: Synthwave
slug: synthwave
type: theme
version: 1.1.1
description: Retro 80s Synthwave Theme
icon: microchip
author:
  name: Dr Droid
  email: gravdev@drdroid.fr
  url: https://github.com/DrDroid-FR/
homepage: https://github.com/DrDroid-FR/grav-theme-synthwave
demo: https://drdroid.fr/synthwave
keywords: synthwave, retro, 80s, neon, theme
bugs: https://github.com/DrDroid-FR/grav-theme-synthwave/issues
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose

  fields:
    production-mode:
      type: toggle
      label: Production Mode
      help: Enable production mode for optimized loading
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    site_name:
      type: text
      label: Site Name
      help: Override the site name displayed in the header (defaults to site.title)

    logo_image:
      type: toggle
      label: Enable Logo Image
      help: Use an image as the logo instead of text
      highlight: 0
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    logo_image_file:
      type: file
      label: Logo Image File
      help: Upload your logo image (SVG, PNG, etc.)
      destination: 'theme://images'
      accept:
        - .svg
        - .png
        - .jpg
        - .jpeg
        - .gif

    music-file:
      type: file
      label: Background Music
      help: Select an MP3 file as background music
      destination: 'theme://songs'
      accept:
        - .mp3
        - .wav
        - .ogg

    hide-play-button:
      type: toggle
      label: Hide Play Button
      help: Hide the music play button in the hero
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    enable-ajax:
      type: toggle
      label: Enable AJAX Navigation
      help: Enable smooth page transitions without page reload - keeps music playing across pages
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    enable-vhs:
      type: toggle
      label: Enable VHS Effect
      help: Add retro VHS glitch effect overlay
      highlight: 0
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    _hero_section:
      type: section
      title: Custom Hero Section
      underline: true

    hero_decoration_type:
      type: select
      label: Hero Decoration Style
      help: Choose the decorative elements behind the title
      default: default
      options:
        default: Default (Sun + City + Grid)
        image: Custom Background Image
        video: Custom Background Video
        twig: Custom Twig Template
        none: No Decoration

    hero_decoration_image:
      type: file
      label: Hero Decoration Image
      help: Upload a custom background image to replace the default decorations
      destination: 'theme://images'
      accept:
        - .jpg
        - .jpeg
        - .png
        - .webp
        - .svg

    hero_decoration_video:
      type: file
      label: Hero Decoration Video
      help: Upload a video to replace the default decorations
      destination: 'theme://videos'
      accept:
        - .mp4
        - .webm
        - .ogg

    hero_custom_twig:
      type: text
      label: Custom Twig Template
      help: Enter the filename (e.g. "custom-hero.html.twig") to load from theme templates/partials/ folder

    
